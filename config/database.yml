# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: molatech_development

test:
  <<: *default
  database: test_db
  adapter: postgresql
  encoding: unicode
  pool: 5
  username: postgres
  password: postgres
  host: postgres://postgres:postgres@db:5432/test_db

production:
  primary: &primary_production
    <<: *default
    database: molatech_production
    username: molatech
    password: <%= ENV["MOLATECH_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: molatech_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: molatech_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: molatech_production_cable
    migrations_paths: db/cable_migrate
